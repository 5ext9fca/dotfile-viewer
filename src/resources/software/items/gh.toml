schema_version = 1

[install."linux.apt"]
order = "20"
method = "apt"
packages = "gh"
source_kind = "default"

[install."linux.dnf"]
order = "20"
method = "dnf"
packages = "gh"
source_kind = "default"

[install."linux.pacman"]
order = "20"
method = "pacman"
packages = "github-cli"
source_kind = "default"

[install."macos"]
order = "20"
method = "brew"
packages = "gh"
source_kind = "default"
install_depends_on = "homebrew"

[install."windows"]
order = "40"
method = "winget"
packages = "GitHub.cli"
source_kind = "winget"
source_repo = "winget"
detect_files = "path:gh.exe"

# Do not capture hosts.yml, which may contain authentication tokens.
[[config]]
id = "settings"
platforms = ["macos"]
root = "config_home"
path = "gh/config.yml"
exclude = []
