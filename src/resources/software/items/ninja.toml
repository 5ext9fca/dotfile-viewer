schema_version = 1

[install."linux.apt"]
order = "20"
method = "apt"
packages = "ninja-build"
source_kind = "default"

[install."linux.dnf"]
order = "20"
method = "dnf"
packages = "ninja-build"
source_kind = "default"

[install."linux.pacman"]
order = "20"
method = "pacman"
packages = "ninja"
source_kind = "default"

[install."macos"]
order = "20"
method = "brew"
packages = "ninja"
source_kind = "default"
install_depends_on = "homebrew"

[install."windows"]
order = "40"
method = "winget"
packages = "Ninja-build.Ninja"
source_kind = "winget"
source_repo = "winget"
detect_files = "path:ninja.exe"
