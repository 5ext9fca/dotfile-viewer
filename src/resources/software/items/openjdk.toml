schema_version = 1

[install."linux.apt"]
order = "20"
method = "apt"
packages = "default-jdk"
source_kind = "default"

[install."linux.dnf"]
order = "20"
method = "dnf"
packages = "java-25-openjdk-devel"
source_kind = "default"

[install."linux.pacman"]
order = "20"
method = "pacman"
packages = "jdk-openjdk"
