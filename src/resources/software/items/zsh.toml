schema_version = 1

[install."linux.apt"]
order = "20"
method = "apt"
packages = "zsh"
source_kind = "default"

[install."linux.dnf"]
order = "20"
method = "dnf"
packages = "zsh"
source_kind = "default"

[install."linux.pacman"]
order = "20"
method = "pacman"
packages = "zsh"
source_kind = "default"

# macOS uses /bin/zsh. Capture only the verified macOS configuration.
[[config]]
id = "rc"
platforms = ["macos"]
root = "home"
path = ".zshrc"
exclude = []

[[config]]
id = "profile"
platforms = ["macos"]
root = "home"
path = ".zprofile"
exclude = []

[[config]]
id = "plugins"
platforms = ["macos"]
root = "home"
path = ".zsh_plugins.txt"
exclude = []

[[config]]
id = "settings"
platforms = ["macos"]
root = "config_home"
path = "zsh"
exclude = []

[[config]]
id = "abbreviations"
platforms = ["macos"]
root = "config_home"
path = "zsh-abbr/user-abbreviations"
exclude = []

[[config]]
id = "env"
platforms = ["macos"]
root = "home"
path = ".zshenv"
