schema_version = 1

[install."linux.apt"]
order = "20"
method = "apt"
packages = "zsh"
source_kind = "default"

[install."linux.dnf"]
order = "20"
method = "dnf"
packages = "zsh"
source_kind = "default"

[install."linux.pacman"]
order = "20"
method = "pacman"
packages = "zsh"
source_kind = "default"

# macOS uses the system Zsh.
[[config]]
id = "rc"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "home"
path = ".zshrc"
exclude = []

[[config]]
id = "profile"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "home"
path = ".zprofile"
exclude = []

[[config]]
id = "plugins"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "home"
path = ".zsh_plugins.txt"
exclude = []

[[config]]
id = "settings"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "config_home"
path = "zsh"
exclude = []

[[config]]
id = "abbreviations"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "config_home"
path = "zsh-abbr/user-abbreviations"
exclude = []

[[config]]
id = "env"
platforms = ["linux.apt", "linux.dnf", "linux.pacman", "macos"]
root = "home"
path = ".zshenv"
