schema_version = 1

[requires]
"linux.apt" = ["noto-cjk", "jetbrains-mono"]
"linux.dnf" = ["noto-cjk", "jetbrains-mono"]
"linux.pacman" = ["noto-cjk", "jetbrains-mono"]

[[config]]
id = "fontconfig"
platforms = ["linux.apt", "linux.dnf", "linux.pacman"]
environments = ["native"]
root = "config_home"
path = "fontconfig/conf.d/60-dotfiles-fonts.conf"

[[config]]
id = "kde"
platforms = ["linux.apt", "linux.dnf", "linux.pacman"]
environments = ["native"]
root = "config_home"
path = "kdeglobals"

[[config]]
id = "gtk3"
platforms = ["linux.apt", "linux.dnf", "linux.pacman"]
environments = ["native"]
root = "config_home"
path = "gtk-3.0/settings.ini"

[[config]]
id = "gtk4"
platforms = ["linux.apt", "linux.dnf", "linux.pacman"]
environments = ["native"]
root = "config_home"
path = "gtk-4.0/settings.ini"
